<script>'use strict';

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullscreen').title='Utiliza la opción de pantalla completa de tu navegador'}}$('fullscreen').onclick=fullscreen;

try{const s=JSON.parse(localStorage.getItem('ahuja-timer'));if(s&&Number.isInteger(s.index)&&s.index>=0&&s.index<6&&Number.isFinite(s.remaining)&&Number.isFinite(s.deadline)){index=s.index;remaining=s.remaining;running=!!s.running;deadline=s.deadline;started=!!s.started;alerted=!!s.alerted;$('sound').checked=!!s.sound}}catch{}
